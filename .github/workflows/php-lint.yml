name: PHP syntax

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  php-lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
      - name: Check PHP syntax
        run: find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
      - name: Run NotificationService contract tests
        run: php tests/run.php
      - name: Run AD authorization and confirmation contract tests
        run: php tests/ad-request.php
      - name: Run AD agent HMAC contract tests
        run: php tests/agent-auth.php
      - name: Run AD agent secret storage contract tests
        run: php tests/agent-secret-store.php
      - name: Run AD agent queue contract tests
        run: php tests/ad-agent-queue.php


  windows-agent-syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse agent scripts with Windows PowerShell 5.1
        shell: powershell
        run: |
          $files = @('windows/Agent.ps1', 'windows/Install-AgentSecret.ps1')
          foreach ($file in $files) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file).Path, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Error $_ }
              exit 1
            }
            Write-Host "PowerShell 5.1 syntax OK: $file"
          }
      - name: Verify HMAC protocol against PHP test vector
        shell: powershell
        run: .\windows\Test-AgentHmac.ps1
